name: 每日演化

on:
  schedule:
    # 每天北京时间凌晨2点运行（UTC 18:00 = 北京时间次日2:00）
    - cron: '0 18 * * *'
  workflow_dispatch: # 也支持手动触发

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests Pillow

      - name: 拉取今日 NASA APOD
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python engine/fetch_apod.py

      - name: 演化2个新天体
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: python engine/evolve.py --count 2

      - name: 修复空碰撞文本
        run: python scripts/fix_empty_collisions.py || true

      - name: 导出星空页面数据
        run: python scripts/export_data.py

      - name: 提交并推送
        run: |
          git config user.name "私宇宙演化引擎"
          git config user.email "cosmos-bot@users.noreply.github.com"
          git add data/ assets/ web/
          git commit -m "🌌 每日演化: $(date -u +%Y-%m-%d) 宇宙又长大了" || echo "无变更"
          git push

  deploy:
    needs: evolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出最新代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 重新导出最新数据
        run: python scripts/export_data.py

      - name: 整理 Pages 文件
        run: |
          mkdir -p _site
          cp -r web/* _site/
          if [ ! -f _site/index.html ]; then
            cp _site/private-cosmos-skymap.html _site/index.html
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
