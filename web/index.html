<script>
  // V4-M5-C：全局错误兜底（FR-08 后半）——控制台结构化日志 + 非侵入 toast（不打断渲染）
  (function () {
    function showToast(msg) {
      var t = document.createElement('div');
      t.id = 'global-error-toast';
      t.textContent = '运行异常：' + msg + '（详情见控制台）';
      t.style.cssText = [
        'position:fixed', 'right:16px', 'bottom:16px', 'z-index:99999',
        'background:rgba(20,20,20,.92)', 'color:#d0d0d0', 'border:1px solid #3a2a2a',
        'border-left:3px solid #b06060', 'border-radius:6px', 'padding:10px 14px',
        'font:12px/1.6 system-ui,sans-serif', 'max-width:340px',
        'box-shadow:0 4px 16px rgba(0,0,0,.5)', 'pointer-events:none',
        'opacity:0', 'transition:opacity .3s',
      ].join(';');
      (document.body || document.documentElement).appendChild(t);
      requestAnimationFrame(function () { t.style.opacity = '1'; });
      setTimeout(function () {
        t.style.opacity = '0';
        setTimeout(function () { t.remove(); }, 350);
      }, 4000);
    }
    window.addEventListener('error', function (e) {
      console.error('[global-error]', JSON.stringify({
        message: e.message, source: e.filename, line: e.lineno, col: e.colno,
      }), e.error || '');
      // V4-M5-B：fatal 态（数据守卫已触发、错误页已全屏呈现）——抑制默认 Uncaught
      // 控制台输出与连环 toast（信息已由上方结构化日志完整记录）；正常态不受影响
      if (window.SkyMap && window.SkyMap.fatal) { e.preventDefault(); return; }
      showToast(String(e.message || e.error || '未知错误').slice(0, 120));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      console.error('[global-rejection]', JSON.stringify({
        reason: r && r.message ? r.message : String(r),
      }), r && r.stack ? r.stack : '');
      // V4-M5c（P3 修补）：与 error 监听同口径——fatal 态抑制连环 toast（信息已由结构化日志记录）
      if (window.SkyMap && window.SkyMap.fatal) { e.preventDefault(); return; }
      showToast(String(r && r.message ? r.message : r).slice(0, 120));
    });
  })();
</script>

  // Service Worker 注册（Day 6 · 6.1，PWA 离线能力）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('[sw] Service Worker 注册成功：scope=' + reg.scope))
        .catch((err) => console.error('[sw] Service Worker 注册失败：', err));
    });
  }
</script>
<script>
  // V4-S3-B (NFR-02 回流 M1-C)：echarts + charts.js 移出首屏关键路径——window.load 后空闲动态加载。
  // URL 与 sw.js PRECACHE 完全一致（含 v 参数，SW cache-first 精确命中，离线仍可用）；统计面板功能不变（M5 已验收口径）
  window.addEventListener('load', function () {
    function loadCharts() {
      var s = document.createElement('script');
      s.src = '_shared/js/echarts.min.js?v=20260816M5';
      s.onload = function () {
        var m = document.createElement('script');
        m.type = 'module';
        m.src = 'assets/charts.js?v=20260816M5';
        document.body.appendChild(m);
      };
      s.onerror = function () { console.error('[charts] echarts 懒加载失败，统计面板不可用'); };
      document.body.appendChild(s);
    }
    if ('requestIdleCallback' in window) { requestIdleCallback(loadCharts, { timeout: 1500 }); }
    else { setTimeout(loadCharts, 300); }
  });
</script>
