<title>私宇宙 · Private Cosmos</title>
<link rel="stylesheet" href="css/base.css">
<script type="importmap">
{
  "imports": {
    "three": "./_shared/js/three/three.module.js",
    "three/addons/": "./_shared/js/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<script>
  // Service Worker 注册（Day 6 · 6.1，PWA 离线能力）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('[sw] Service Worker 注册成功：scope=' + reg.scope))
        .catch((err) => console.error('[sw] Service Worker 注册失败：', err));
    });
  }
</script>
</body>
</html>
